<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">SuperGrok、X Premium+与Grok API关系</title>
  <desc id="desc">区分Grok个人订阅、X平台会员和开发者API</desc>
  <rect width="1200" height="500" rx="24" fill="#f5f7fb"/>
  <text x="600" y="64" text-anchor="middle" font-size="34" font-weight="700" fill="#1f2937" font-family="Arial, PingFang SC, sans-serif">SuperGrok、X Premium+、Grok API 不是一回事</text>
  <g font-family="Arial, PingFang SC, sans-serif">
    <g transform="translate(85 125)"><rect width="310" height="280" rx="22" fill="#fff" stroke="#1778f2" stroke-width="3"/><text x="155" y="62" text-anchor="middle" font-size="30" font-weight="700" fill="#1778f2">SuperGrok</text><text x="155" y="110" text-anchor="middle" font-size="19" fill="#444">Grok个人订阅</text><text x="155" y="155" text-anchor="middle" font-size="17" fill="#666">聊天 · 搜索 · Imagine</text><text x="155" y="187" text-anchor="middle" font-size="17" fill="#666">Voice · Build等能力</text><line x1="50" y1="220" x2="260" y2="220" stroke="#ddd"/><text x="155" y="255" text-anchor="middle" font-size="16" fill="#b42318">不包含 API 余额</text></g>
    <g transform="translate(445 125)"><rect width="310" height="280" rx="22" fill="#fff" stroke="#4b5563" stroke-width="3"/><text x="155" y="62" text-anchor="middle" font-size="28" font-weight="700" fill="#374151">X Premium+</text><text x="155" y="110" text-anchor="middle" font-size="19" fill="#444">X平台会员</text><text x="155" y="155" text-anchor="middle" font-size="17" fill="#666">平台会员权益</text><text x="155" y="187" text-anchor="middle" font-size="17" fill="#666">附带部分Grok权益</text><line x1="50" y1="220" x2="260" y2="220" stroke="#ddd"/><text x="155" y="255" text-anchor="middle" font-size="16" fill="#b42318">不等于 SuperGrok</text></g>
    <g transform="translate(805 125)"><rect width="310" height="280" rx="22" fill="#fff" stroke="#16803c" stroke-width="3"/><text x="155" y="62" text-anchor="middle" font-size="30" font-weight="700" fill="#16803c">Grok API</text><text x="155" y="110" text-anchor="middle" font-size="19" fill="#444">开发者接口</text><text x="155" y="155" text-anchor="middle" font-size="17" fill="#666">使用 API Key</text><text x="155" y="187" text-anchor="middle" font-size="17" fill="#666">按调用量独立计费</text><line x1="50" y1="220" x2="260" y2="220" stroke="#ddd"/><text x="155" y="255" text-anchor="middle" font-size="16" fill="#b42318">与会员分开购买</text></g>
  </g>
  <text x="600" y="460" text-anchor="middle" font-size="18" fill="#666" font-family="Arial, PingFang SC, sans-serif">先看用途，再付款；软件要求 API Key 时不要买错会员</text>
</svg>
